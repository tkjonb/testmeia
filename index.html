<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escola Paraná - App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    width:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Container que centraliza e simula uma tela de celular, mantendo proporção 540x960 sem scroll */
  #phone-frame {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0a0a;
  }

  #screen {
    position:relative;
    width:100%;
    height:100%;
    max-width:960px;
    max-height:960px;
    aspect-ratio:540/960;
    background:#000;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
  }

  @media (min-aspect-ratio: 540/960) {
    #screen { height:100%; width:auto; }
  }
  @media (max-aspect-ratio: 540/960) {
    #screen { width:100%; height:auto; }
  }

  .page {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:none;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .page.active { display:block; }

  .page img {
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  /* Zonas clicaveis - posicionadas em % relativo a imagem 540x960 */
  .hotspot {
    position:absolute;
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* debug helper (desativado) */
  .hotspot.debug {
    background:rgba(255,0,0,0.25);
    border:1px solid rgba(255,0,0,0.6);
  }

  /* Pagina 1 (home) -> botao Menu, canto inferior direito da barra de navegacao */
  #hotspot-menu {
    left:73.5%;
    top:90.5%;
    width:17%;
    height:9%;
  }

  /* Pagina 2 (menu) -> icone Perfil */
  #hotspot-perfil {
    left:15.5%;
    top:39.5%;
    width:19%;
    height:11.5%;
  }

  /* pequena transicao suave entre paginas */
  .page {
    transition:opacity .18s ease;
    opacity:0;
  }
  .page.active {
    opacity:1;
  }
</style>
</head>
<body>

<div id="phone-frame">
  <div id="screen">

    <!-- PAGINA 1 -->
    <div class="page active" id="page-1">
      <img src="images/pagina1.png" alt="Pagina 1 - Inicio" draggable="false">
      <div class="hotspot" id="hotspot-menu" onclick="goTo(2)" aria-label="Abrir menu"></div>
    </div>

    <!-- PAGINA 2 -->
    <div class="page" id="page-2">
      <img src="images/pagina2.png" alt="Pagina 2 - Menu" draggable="false">
      <div class="hotspot" id="hotspot-perfil" onclick="goTo(3)" aria-label="Abrir perfil"></div>
    </div>

    <!-- PAGINA 3 -->
    <div class="page" id="page-3">
      <img src="images/pagina3.png" alt="Pagina 3 - Perfil" draggable="false">
    </div>

  </div>
</div>

<script>
  function goTo(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + n).classList.add('active');
  }
</script>

</body>
</html>
